<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkillSync Animation</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #lottie {
      width: 500px;
      height: 500px;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      background: #222;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div id="lottie"></div>

  <div class="controls">
    <button onclick="playAnim()">▶ Play</button>
    <button onclick="pauseAnim()">⏸ Pause</button>
    <button onclick="stopAnim()">⏹ Stop</button>
    <button onclick="slowAnim()">🐢 Slow</button>
    <button onclick="fastAnim()">⚡ Fast</button>
    <button onclick="toggleLoop()">🔁 Toggle Loop</button>
  </div>

  <!-- Lottie -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

  <script>
    let animation;
    let isLooping = true;

    animation = lottie.loadAnimation({
      container: document.getElementById('lottie'),
      renderer: 'svg',
      loop: isLooping,
      autoplay: true,
      path: 'skillsync.json' // your working file
    });

    function playAnim() {
      animation.play();
    }

    function pauseAnim() {
      animation.pause();
    }

    function stopAnim() {
      animation.stop();
    }

    function slowAnim() {
      animation.setSpeed(0.5);
    }

    function fastAnim() {
      animation.setSpeed(1.5);
    }

    function toggleLoop() {
      isLooping = !isLooping;
      animation.loop = isLooping;
      alert("Loop: " + isLooping);
    }
  </script>

</body>
</html>
